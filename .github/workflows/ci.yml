name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: cgo boundary
        run: scripts/check_cgo_boundary.sh

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: make vet

      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: lint
        run: golangci-lint run --timeout 5m

      - name: build native library
        run: make native

      - name: test (cgo)
        run: go test ./...

      - name: build without cgo
        run: make build-nocgo

  double-precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: typecheck double-precision
        run: go vet -composites=false -tags jolt_double ./...

      - name: build double native library
        run: make native-double

      - name: test (jolt_double)
        run: go test -tags jolt_double ./...
