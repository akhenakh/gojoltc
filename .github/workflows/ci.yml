name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: cgo boundary
        run: scripts/check_cgo_boundary.sh

      - name: gofmt
        run: make fmt-check

      - name: vet
        run: make vet

      - name: build native library
        run: make native

      - name: test (cgo)
        run: go test ./...

      - name: build without cgo
        run: make build-nocgo
